# 檢查社群回報 Issue 的必填欄位：性格、屬性、正確選項。
# 表單本身已設為必填，這裡是備援：回報者之後編輯 Issue 刪掉內容、或用舊版表單送出時，
# 缺欄位就加上「資料不完整」並留言提醒；補齊後自動移除 label。
name: Validate report

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'data-report')
    runs-on: ubuntu-latest
    steps:
      - name: Check required fields
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          missing=$(node -e '
            const body = process.env.BODY || "";
            // Issue Form 會把每個欄位輸出成「### 標題」加內容，沒填時為 _No response_。
            const field = (label) => {
              const m = body.match(new RegExp("###\\s*" + label + "[^\\n]*\\n+([\\s\\S]*?)(?=\\n###|$)"));
              const v = (m ? m[1] : "").trim();
              return v === "_No response_" ? "" : v;
            };
            const missing = [];
            if (!field("性格")) missing.push("性格");
            if (!field("屬性")) missing.push("屬性");
            if (!field("正確選項")) missing.push("正確選項");
            console.log(missing.join("、"));
          ')
          has_label=$(node -e 'console.log(JSON.parse(process.env.LABELS).includes("資料不完整"))')
          if [ -n "$missing" ]; then
            if [ "$has_label" != "true" ]; then
              gh issue edit "$NUMBER" --add-label "資料不完整"
              gh issue comment "$NUMBER" --body "感謝回報！以下必填欄位還沒填寫：**${missing}**。請點右上角「⋯ → Edit」補上，補齊後這則提醒的標籤會自動移除。"
            fi
          elif [ "$has_label" = "true" ]; then
            gh issue edit "$NUMBER" --remove-label "資料不完整"
          fi
