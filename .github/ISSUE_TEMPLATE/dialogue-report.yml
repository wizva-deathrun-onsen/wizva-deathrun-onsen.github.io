name: 對話資料回報
description: 回報新角色的送死流泉水對話，或修正既有資料
title: "[資料回報] "
labels: ["data-report", "待審核"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！請只回報 **送死流**（隊伍有成員陣亡後泡泉水）觸發的固定對話，一般泉水的隨機對話不適用。
        **必填：角色名稱、性格，以及「正確選項」或「選項文字」至少一項**（兩項都填最好）；其他不確定的欄位可以留空。
        送出後系統會自動檢查，缺少必填欄位會留言提醒。維護者審核後會更新到網站並把你列為補充者。

  - type: input
    id: name_zh
    attributes:
      label: 角色名稱（中文）
      description: 以遊戲繁中版譯名為準；不知道中文名可以填日文
      placeholder: 例如：丹尼爾
    validations:
      required: true

  - type: input
    id: name_ja
    attributes:
      label: 角色名稱（日文）
      placeholder: 例如：ダニエル
    validations:
      required: false

  # GitHub 的必填下拉選單會預設選第一項。性格要顯示必填的紅色 *，
  # 所以第一項放「請選擇」佔住預設值，送出後由 validate-report.yml 把它當成未填。
  # 其他下拉選單維持非必填（預設為 None），避免回報者忘了改而送出錯誤值。
  - type: dropdown
    id: alignment
    attributes:
      label: 性格
      description: 請依角色實際性格選擇
      options:
        - 請選擇
        - 善
        - 中立
        - 惡
        - 不確定
    validations:
      required: true

  - type: dropdown
    id: element
    attributes:
      label: 屬性
      options:
        - 光
        - 暗
        - 水
        - 火
        - 風
        - 土
        - 無
        - 不確定
    validations:
      required: false

  - type: dropdown
    id: option
    attributes:
      label: 正確選項（與選項文字擇一必填）
      description: 由上往下數的第幾個選項；兩項都填最好
      options:
        - "1"
        - "2"
        - "3"
        - 不確定
    validations:
      required: false

  - type: input
    id: answer
    attributes:
      label: 選項文字（與正確選項擇一必填）
      description: 正確選項的文字，中文或日文皆可
      placeholder: 例如：得到上帝寬恕
    validations:
      required: false

  - type: dropdown
    id: bond
    attributes:
      label: 緣份（遣散後的能力加成）
      options:
        - 力
        - 智
        - 敏
        - 信
        - 命
        - 靈
        - 不確定
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截圖（選填）
      description: 可直接把圖片拖曳到這裡
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 備註
      description: 例如資料來源、是修正哪一筆資料、希望署名的名稱
    validations:
      required: false
