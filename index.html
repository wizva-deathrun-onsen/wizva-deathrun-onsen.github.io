<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WizVA 送死流對話選項紀錄</title>
  <meta name="description" content="辟邪除妖 Variants Daphne（Wizardry Variants Daphne）送死流泡泉水的固定對話正確選項與遣散緣份整理。">
  <script>
    // 在第一次繪製前套用主題，避免深色使用者看到淺色閃一下。
    // 規則與 js/theme.js 的 resolveTheme 相同，storage key 也需一致。
    (function () {
      var t = null;
      try { t = localStorage.getItem('wizva-deathrun-onsen:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="title-row">
        <h1 data-i18n="title">WizVA 送死流對話選項紀錄</h1>
        <button type="button" id="theme-toggle" class="theme-toggle">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="notice" data-i18n="notice"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="篩選">
      <div class="row">
        <label class="search">
          <span class="visually-hidden" data-i18n="search"></span>
          <input id="q" type="search" autocomplete="off" data-i18n-placeholder="search">
        </label>
      </div>

      <fieldset id="f-align"><legend data-i18n="filterAlignment"></legend></fieldset>
      <fieldset id="f-elem"><legend data-i18n="filterElement"></legend></fieldset>
      <fieldset id="f-bond"><legend data-i18n="filterBond"></legend></fieldset>

      <div class="row">
        <label class="sort">
          <span data-i18n="sort"></span>
          <select id="sort">
            <option value="default" data-i18n="sortDefault"></option>
            <option value="name" data-i18n="sortName"></option>
            <option value="option" data-i18n="sortOption"></option>
            <option value="bond" data-i18n="sortBond"></option>
          </select>
        </label>
        <button type="button" id="reset" class="link-button" data-i18n="reset"></button>
        <span id="count" class="count" role="status" aria-live="polite"></span>
        <a id="report-all" class="report-all" target="_blank" rel="noopener" data-i18n="reportAll"></a>
      </div>
    </section>

    <div class="table-wrap">
      <table id="table">
        <thead>
          <tr>
            <th scope="col" data-i18n="colAvatar"></th>
            <th scope="col" data-i18n="colName"></th>
            <th scope="col" data-i18n="colAlignment"></th>
            <th scope="col" data-i18n="colElement"></th>
            <th scope="col" data-i18n="colRarity"></th>
            <th scope="col" data-i18n="colOption"></th>
            <th scope="col" data-i18n="colAnswer"></th>
            <th scope="col" data-i18n="colBond"></th>
            <th scope="col" data-i18n="colReport"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden data-i18n="empty"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n="footerCopyright"></p>
      <p><span data-i18n="footerSources"></span>：
        <a id="src-baha" target="_blank" rel="noopener" data-i18n="footerSourceBaha"></a>、
        <a id="src-names" target="_blank" rel="noopener" data-i18n="footerSourceNames"></a></p>
      <p id="contributors-line" hidden><span data-i18n="footerContributors"></span>：<span id="contributors"></span></p>
      <p><a id="repo-link" target="_blank" rel="noopener" data-i18n="footerRepo"></a></p>
    </div>
  </footer>
</body>
</html>
